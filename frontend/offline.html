<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalentUP Fichaje — Sin conexión</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f7;color:#1d1d1f;-webkit-font-smoothing:antialiased}
    .card{background:#ffffff;border-radius:16px;padding:48px 40px;width:100%;max-width:360px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,0.04),0 8px 24px rgba(0,0,0,0.06)}
    .icon{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:16px;background:#FF6B35;margin-bottom:24px}
    h1{font-size:1.375rem;font-weight:600;letter-spacing:-0.028em;margin-bottom:8px}
    p{color:rgba(0,0,0,0.45);font-size:0.875rem;line-height:1.5;margin-bottom:24px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:980px;background:#FF6B35;color:#fff;font-weight:500;font-size:0.875rem;text-decoration:none;transition:opacity 200ms ease}
    .btn:hover{opacity:0.88}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="36" height="36" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="none"/><path d="M8 16L14 22L24 10" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet. TalentUP Fichaje necesita conexión para registrar fichajes.</p>
    <a href="./index.html" class="btn">Reintentar</a>
  </div>
</body>
</html>
