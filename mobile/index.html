<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fichaje">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF6B35">
<link rel="manifest" href="/mobile/manifest.json">
<link rel="apple-touch-icon" href="/mobile/icons/icon-192.png">
<title>TalentUP Fichaje</title>
<link rel="stylesheet" href="../frontend/design_system.css">
<style>
/* ============================================================
   TalentUP Fichaje — Mobile PWA
   Migrado a design_system.css — reset, base, botones, utilities y
   tokens viven alli como unica fuente de verdad. Aqui solo los
   componentes especificos del PWA empleado, expresados con tokens.
   ============================================================ */

/* ===== BASE PWA (sobreescribe body del DS: superficie app blanca) ===== */
body{
  background:var(--bg-surface);
  color:var(--text-primary);
  font-family:var(--font-sans);
  font-size:var(--text-body);
  line-height:var(--leading-normal);
  letter-spacing:var(--tracking-normal);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  user-select:none;
  -webkit-user-select:none;
}
button{-webkit-tap-highlight-color:transparent}

/* ===== SAFE AREA ===== */
.safe-top{padding-top:env(safe-area-inset-top,var(--space-3))}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,var(--space-3))}

/* ===== SCREENS ===== */
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.active{display:flex;flex-direction:column}

/* ===== LOGIN SCREEN ===== */
#login-screen{align-items:center;justify-content:center;padding:var(--space-6);background:var(--bg-surface)}
.login-card{width:100%;max-width:340px}
.login-brand{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-1)}
.login-brand h1{font-size:var(--text-h1);font-weight:600;color:var(--text-primary);letter-spacing:var(--tracking-snug);line-height:var(--leading-tight)}
.login-sub{color:var(--text-secondary);font-size:var(--text-body-sm);margin-bottom:var(--space-8)}
.login-form{display:flex;flex-direction:column;gap:var(--space-4)}
.login-form label{display:block;font-size:var(--text-micro);font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:var(--tracking-label);margin-bottom:var(--space-1)}
.login-form .btn{margin-top:var(--space-1);width:100%;min-height:var(--touch-min);padding:0 var(--space-6);font-size:var(--text-body);font-weight:500}
.login-error{color:var(--danger);font-size:var(--text-caption);text-align:center;min-height:20px;font-weight:400;margin-top:var(--space-1)}

/* ===== PIN INPUT ===== */
.pin-inputs{display:flex;gap:var(--space-3);justify-content:center}
.pin-inputs input{
  width:52px;height:58px;text-align:center;font-size:var(--text-h2);font-weight:600;
  padding:0;border-radius:var(--radius-xl);background:var(--bg-app);caret-color:var(--brand);
  color:var(--text-primary);border:1px solid transparent;
  -webkit-appearance:none;appearance:none
}
.pin-inputs input:focus{box-shadow:0 0 0 2px var(--brand-tint-35);background-color:var(--bg-surface)}
.pin-inputs input.filled{background-color:var(--bg-surface);box-shadow:0 0 0 1.5px var(--brand-tint-35)}

/* ===== MAIN SCREEN ===== */
#main-screen{background:var(--bg-surface)}
.main-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-4) var(--space-5);
  padding-top:max(var(--space-4),env(safe-area-inset-top,var(--space-4)));
  border-bottom:1px solid var(--border)
}
.main-header h1{font-size:var(--text-h2);font-weight:600;letter-spacing:var(--tracking-normal)}
.main-header-actions{display:flex;align-items:center;gap:var(--space-2)}
.main-content{flex:1;padding:var(--space-6) var(--space-5);display:flex;flex-direction:column;gap:var(--space-6);overflow-y:auto}

/* ===== CLOCK BUTTON ===== */
.clock-section{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);padding:var(--space-5) 0}
.clock-btn{
  width:200px;height:200px;border-radius:50%;
  background:var(--brand);color:var(--text-on-brand);
  display:flex;align-items:center;justify-content:center;
  font-size:var(--text-h1);font-weight:600;letter-spacing:var(--tracking-normal);
  box-shadow:0 var(--space-1) var(--space-5) var(--brand-tint-35);
  transition:all var(--dur-slow) var(--ease-out);
  position:relative;overflow:hidden;
  -webkit-tap-highlight-color:transparent
}
.clock-btn:active{transform:scale(0.95);box-shadow:0 var(--space-1) var(--space-3) var(--brand-tint-35)}
.clock-btn-label{display:flex;flex-direction:column;align-items:center;gap:var(--space-1)}
.clock-btn-label svg{margin-bottom:var(--space-1)}
.clock-status{font-size:var(--text-body-sm);color:var(--text-secondary);font-weight:400;text-align:center;min-height:var(--space-6);font-variant-numeric:var(--tnum)}

/* ===== TOAST (override DS .toast — el PWA usa toggle .show, centrado abajo) ===== */
.toast{
  position:fixed;bottom:var(--space-20);left:50%;transform:translateX(-50%) translateY(var(--space-5));
  background:var(--text-primary);color:var(--text-on-brand);padding:var(--space-3) var(--space-6);border-radius:var(--radius-2xl);
  font-size:var(--text-body);font-weight:500;letter-spacing:var(--tracking-normal);
  box-shadow:var(--shadow-float);
  opacity:0;transition:all var(--dur-slow) var(--ease-out);
  z-index:var(--z-toast);pointer-events:none;white-space:nowrap;
  display:flex;align-items:center;gap:var(--space-2)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-icon{flex-shrink:0;display:flex}

/* ===== TODAY HISTORY ===== */
.history-section{display:flex;flex-direction:column;gap:var(--space-3)}
.history-header{display:flex;align-items:center;justify-content:space-between}
.history-header h2{font-size:var(--text-body);font-weight:600;letter-spacing:var(--tracking-normal)}
.history-list{display:flex;flex-direction:column;gap:var(--space-2)}
.history-empty{
  text-align:center;padding:var(--space-8) var(--space-4);color:var(--text-tertiary);
  font-size:var(--text-body-sm);display:flex;flex-direction:column;align-items:center;gap:var(--space-2)
}
.history-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-3) var(--space-4);background:var(--bg-surface);border-radius:var(--radius-xl);
  box-shadow:var(--shadow-hairline);
  transition:all var(--dur-base) var(--ease-out)
}
.history-item:active{background:var(--bg-hover)}
.history-item-left{display:flex;align-items:center;gap:var(--space-3)}
.history-item-type{font-weight:600;font-size:var(--text-body-sm)}
.history-item-type.entrada{color:var(--success)}
.history-item-type.salida{color:var(--brand)}
.history-item-time{font-size:var(--text-caption);color:var(--text-secondary);font-variant-numeric:var(--tnum)}
.history-item-location{font-size:var(--text-micro);color:var(--text-tertiary);display:flex;align-items:center;gap:var(--space-1);margin-top:var(--space-1)}

/* ===== OFFLINE BANNER ===== */
.offline-banner{
  background:var(--warning-tint);color:var(--warning-strong);
  text-align:center;padding:var(--space-2) var(--space-4);font-size:var(--text-caption);font-weight:500;
  display:none;align-items:center;justify-content:center;gap:var(--space-1);
  letter-spacing:var(--tracking-caption)
}
.offline-banner.show{display:flex}

/* ===== PENDING SYNC BADGE ===== */
.pending-badge{
  display:inline-flex;align-items:center;gap:var(--space-1);
  background:var(--warning-tint);color:var(--warning-strong);
  font-size:var(--text-micro);font-weight:500;padding:3px var(--space-2);border-radius:var(--radius-pill);
  font-variant-numeric:var(--tnum)
}

/* ===== MODAL (bottom sheet — override DS .modal-overlay centrado) ===== */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:var(--bg-scrim);z-index:var(--z-modal);
  display:none;align-items:flex-end;justify-content:center;
  animation:tu-fade-in var(--dur-base) var(--ease-out)
}
.modal-overlay.show{display:flex}
.modal-sheet{
  background:var(--bg-surface);border-radius:var(--radius-2xl) var(--radius-2xl) 0 0;
  width:100%;max-width:400px;padding:var(--space-6) var(--space-5);
  padding-bottom:max(var(--space-6),env(safe-area-inset-bottom,var(--space-6)));
  animation:tu-rise var(--dur-slow) var(--ease-out);
  max-height:80vh;overflow-y:auto
}
.modal-handle{width:36px;height:var(--space-1);background:var(--border-strong);border-radius:var(--radius-xs);margin:0 auto var(--space-4)}
.modal-title{font-size:var(--text-body);font-weight:600;margin-bottom:var(--space-5);text-align:center;letter-spacing:var(--tracking-normal)}
.modal-actions{display:flex;gap:var(--space-2);margin-top:var(--space-5)}
.modal-actions .btn{flex:1;padding:var(--space-3);font-size:var(--text-body-sm)}

/* ===== RESTAURANT LIST ===== */
.restaurant-list{display:flex;flex-direction:column;gap:var(--space-1)}
.restaurant-option{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);border-radius:var(--radius-xl);background:var(--bg-app);
  transition:all var(--dur-base) var(--ease-out);cursor:pointer
}
.restaurant-option:active{background:var(--brand-tint-08)}
.restaurant-option.selected{background:var(--brand-tint-12);box-shadow:0 0 0 1.5px var(--brand-tint-35)}
.restaurant-option-name{font-weight:500;font-size:var(--text-body-sm)}
.restaurant-option-address{font-size:var(--text-caption);color:var(--text-secondary);margin-top:1px}

/* ===== SVG ICON HELPERS ===== */
.icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-12{width:12px;height:12px}
.icon-16{width:16px;height:16px}
.icon-18{width:18px;height:18px}
.icon-20{width:20px;height:20px}
.icon-24{width:24px;height:24px}
.icon-28{width:28px;height:28px}
.icon-32{width:32px;height:32px}

/* ===== RESPONSIVE ===== */
@media(max-width:420px){
  .clock-btn{width:170px;height:170px;font-size:var(--text-h2)}
  .main-content{padding:var(--space-5) var(--space-4)}
  .pin-inputs input{width:48px;height:52px;font-size:var(--text-body)}
}
@media(min-width:421px){
  .main-content{max-width:400px;margin:0 auto;width:100%}
  .login-card{max-width:360px;margin:0 auto}
}
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen" class="screen active">
  <div class="login-card">
    <div class="login-brand">
      <!-- SF Symbols-style clock icon -->
      <svg class="icon icon-28" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <polyline points="12 7 12 12 15 15"/>
      </svg>
      <h1>TalentUP</h1>
    </div>
    <p class="login-sub">Fichaje para empleados</p>
    <form id="login-form" class="login-form" autocomplete="off">
      <div>
        <label for="login-pin">PIN de empleado</label>
        <div class="pin-inputs" id="pin-inputs">
          <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" data-index="0" autocomplete="off" autocorrect="off" spellcheck="false">

          <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" data-index="2" autocomplete="off" autocorrect="off" spellcheck="false">
          <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" data-index="3" autocomplete="off" autocorrect="off" spellcheck="false">
        </div>

        <label for="login-tenant">Restaurante</label>

          <polyline points="12 5 19 12 12 19"/>

</div>

<!-- ===== MAIN SCREEN ===== -->
<div id="main-screen" class="screen">
  <!-- Offline banner -->
  <div class="offline-banner" id="offline-banner">
    <svg class="icon icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
    Sin conexion — los fichajes se guardaran y enviaran al reconectar
  </div>

  <!-- Header -->
  <div class="main-header">
    <div class="flex items-center gap-2">
      <svg class="icon icon-20" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <polyline points="12 7 12 12 15 15"/>
      </svg>
      <h1>TalentUP</h1>
    </div>
    <div class="main-header-actions">
      <span id="pending-badge" class="pending-badge hidden">
        <svg class="icon icon-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Main content -->
  <div class="main-content">

    <div class="clock-section">

    <!-- Today's history -->
    <div class="history-section">
      <div class="history-header">

<!-- ===== TOAST ===== -->
<div class="toast" id="toast">
  <span class="toast-icon" id="toast-icon">

      <polyline points="22 4 12 14.01 9 11.01"/>

</div>

<!-- ===== CHANGE RESTAURANT MODAL ===== -->
<div class="modal-overlay" id="tenant-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Cambiar restaurante</div>
    <div class="restaurant-list" id="tenant-list"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="tenant-modal-cancel">Cancelar</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   TalentUP Fichaje — Mobile PWA App Logic
   ============================================================ */

// ===== CONFIG =====
const API_BASE = window.location.hostname === 'localhost'
  ? 'http://localhost:8000/api'
  : '/api';

const STORAGE_KEYS = {
  tenantId: 'talentup_mobile_tenant_id',
  tenantName: 'talentup_mobile_tenant_name',
  pendingClocks: 'talentup_mobile_pending',
  lastSync: 'talentup_mobile_last_sync'
};

// ===== STATE =====
let state = {
  tenantId: localStorage.getItem(STORAGE_KEYS.tenantId) || '',
  tenantName: localStorage.getItem(STORAGE_KEYS.tenantName) || '',
  employeePin: '',
  isOnline: navigator.onLine,
  restaurants: [],
  todayClocks: [],
  pendingClocks: []
};

// ===== DOM REFS =====
const $ = id => document.getElementById(id);
const loginScreen = $('login-screen');
const mainScreen = $('main-screen');
const loginForm = $('login-form');
const loginError = $('login-error');
const loginBtn = $('login-btn');
const loginTenant = $('login-tenant');
const pinDigits = document.querySelectorAll('.pin-digit');
const clockBtn = $('clock-btn');
const clockStatus = $('clock-status');
const historyList = $('history-list');
const historyEmpty = $('history-empty');
const toast = $('toast');
const toastText = $('toast-text');
const toastIcon = $('toast-icon');
const offlineBanner = $('offline-banner');
const pendingBadge = $('pending-badge');
const pendingCount = $('pending-count');
const changeTenantBtn = $('change-tenant-btn');
const tenantModal = $('tenant-modal');
const tenantList = $('tenant-list');
const tenantModalCancel = $('tenant-modal-cancel');
const refreshHistoryBtn = $('refresh-history-btn');

// ===== SVG ICONS =====
const ICONS = {
  entrada: '<svg class="icon icon-18" viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>',
  salida: '<svg class="icon icon-18" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  location: '<svg class="icon icon-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  check: '<svg class="icon icon-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  wifiOff: '<svg class="icon icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>'
};

// ===== API HELPER =====
async function api(method, path, body) {
  const url = `${API_BASE}${path}`;
  const opts = { method, credentials: 'include', headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  try {
    const res = await fetch(url, opts);
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.detail || `Error ${res.status}`);
    }
    return await res.json();
  } catch(e) {
    if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError') || e.message.includes('ERR_CONNECTION')) {
      return null; // offline
    }
    throw e;
  }
}

// ===== RESTAURANTS =====
async function loadRestaurants() {
  try {
    const data = await api('GET', '/tenants');
    if (data && Array.isArray(data)) {
      state.restaurants = data;
    } else if (data && data.tenants) {
      state.restaurants = data.tenants;
    }
  } catch(e) {
    console.warn('Failed to load restaurants:', e);
  }
  // Fallback demo restaurants if API unavailable
  if (state.restaurants.length === 0) {
    state.restaurants = [
      { id: 'demo_01', name: 'Restaurante Demo Centro', address: 'Calle Mayor 1' },
      { id: 'demo_02', name: 'Restaurante Demo Norte', address: 'Av. de la Constitucion 42' },
      { id: 'demo_03', name: 'Restaurante Demo Sur', address: 'Plaza del Sol 8' }
    ];
  }
  return state.restaurants;
}

function populateTenantSelect(restaurants) {
  loginTenant.innerHTML = '<option value="">Seleccionar restaurante</option>';
  restaurants.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id || r.tenant_id || r;
    opt.textContent = r.name || r.nombre || r.id || r;
    loginTenant.appendChild(opt);
  });
  // Restore saved tenant
  if (state.tenantId) {
    loginTenant.value = state.tenantId;
  }
}

function populateTenantModalList(restaurants) {
  tenantList.innerHTML = '';
  restaurants.forEach(r => {
    const id = r.id || r.tenant_id || r;
    const name = r.name || r.nombre || id;
    const address = r.address || r.direccion || r.address || '';
    const div = document.createElement('div');
    div.className = 'restaurant-option' + (id === state.tenantId ? ' selected' : '');
    div.innerHTML = `
      <div>
        <div class="restaurant-option-name">${name}</div>
        ${address ? `<div class="restaurant-option-address">${address}</div>` : ''}
      </div>
    `;
    div.addEventListener('click', () => selectTenant(id, name));
    tenantList.appendChild(div);
  });
}

function selectTenant(id, name) {
  state.tenantId = id;
  state.tenantName = name;
  localStorage.setItem(STORAGE_KEYS.tenantId, id);
  localStorage.setItem(STORAGE_KEYS.tenantName, name);
  closeTenantModal();
  updateHeaderTenant();
  loadTodayHistory();
}

function updateHeaderTenant() {
  // Update header subtitle if we add one
}

// ===== PIN INPUT LOGIC =====
pinDigits.forEach((input, idx) => {
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 1);
    if (input.value) {
      input.classList.add('filled');
      if (idx < 3) pinDigits[idx + 1].focus();
    } else {
      input.classList.remove('filled');
    }
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !input.value && idx > 0) {
      pinDigits[idx - 1].focus();
      pinDigits[idx - 1].value = '';
      pinDigits[idx - 1].classList.remove('filled');
    }
  });
  input.addEventListener('focus', () => input.select());
});

function getPin() {
  return Array.from(pinDigits).map(i => i.value).join('');
}

function clearPin() {
  pinDigits.forEach(i => { i.value = ''; i.classList.remove('filled'); });
  pinDigits[0].focus();
}

// ===== LOGIN =====
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pin = getPin();
  const tenantId = loginTenant.value;

  if (pin.length !== 4) {
    loginError.textContent = 'El PIN debe tener 4 digitos';
    return;
  }
  if (!tenantId) {
    loginError.textContent = 'Selecciona un restaurante';
    return;
  }

  loginError.textContent = '';
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<svg class="icon icon-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" stroke="currentColor"/></svg> Verificando...';

  try {
    // Verify PIN by attempting to get today's clocks (validates PIN + tenant)
    const result = await api('POST', '/clock/verify', { pin, tenant_id: tenantId });
    if (result === null) {
      // Network error — allow offline login if we have saved credentials
      loginError.textContent = 'Sin conexion. Intentalo de nuevo cuando tengas red.';
      loginBtn.disabled = false;
      loginBtn.innerHTML = 'Entrar';
      return;
    }
    // Success
    state.employeePin = pin;
    state.tenantId = tenantId;
    state.tenantName = loginTenant.options[loginTenant.selectedIndex].text;
    localStorage.setItem(STORAGE_KEYS.tenantId, tenantId);
    localStorage.setItem(STORAGE_KEYS.tenantName, state.tenantName);
    enterApp();
  } catch(e) {
    loginError.textContent = e.message || 'Error al verificar el PIN';
    loginBtn.disabled = false;
    loginBtn.innerHTML = 'Entrar';
  }
});

// ===== ENTER APP =====
function enterApp() {
  loginScreen.classList.remove('active');
  mainScreen.classList.add('active');
  loadTodayHistory();
  syncPendingClocks();
}

// ===== CHECK IF LOGGED IN =====
function checkSession() {
  if (state.tenantId) {
    loginTenant.value = state.tenantId;
  }
  // Siempre pedir PIN; nunca se persiste
  clearPin();
  // Asegurar que no quede un PIN antiguo en memoria ni en storage
  state.employeePin = '';
}

// ===== CLOCK IN/OUT =====
clockBtn.addEventListener('click', async () => {
  if (clockBtn.disabled) return;
  clockBtn.disabled = true;

  // Get geolocation if available
  let lat = null, lng = null;
  try {
    if (navigator.geolocation) {
      const pos = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, () => reject(), {
          enableHighAccuracy: false,
          timeout: 3000,
          maximumAge: 60000
        });
      });
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
    }
  } catch(e) {
    // Geolocation not available or denied — continue without it
  }

  const payload = {
    pin: state.employeePin,
    type: 'auto',
    tenant_id: state.tenantId
  };
  if (lat !== null && lng !== null) {
    payload.latitude = lat;
    payload.longitude = lng;
  }

  try {
    const result = await api('POST', '/clock', payload);
    if (result === null) {
      // Offline — save to pending queue
      savePendingClock(payload);
      showToast('Fichaje guardado sin conexion', 'check');
      clockStatus.textContent = 'Se sincronizara cuando haya red';
    } else {
      // Success
      const now = new Date();
      const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      const type = result.type || (result.is_entry !== false ? 'Entrada' : 'Salida');
      showToast(`${type} ${timeStr}`, 'check');
      clockStatus.textContent = `Fichado a las ${timeStr}`;
      loadTodayHistory();
    }
  } catch(e) {
    showToast('Error al fichar', 'check');
    clockStatus.textContent = 'Intentalo de nuevo';
  }

  clockBtn.disabled = false;
});

// ===== PENDING CLOCKS (OFFLINE QUEUE) =====
function savePendingClock(payload) {
  const pending = getPendingClocks();
  pending.push({ ...payload, timestamp: new Date().toISOString(), id: Date.now() });
  localStorage.setItem(STORAGE_KEYS.pendingClocks, JSON.stringify(pending));
  state.pendingClocks = pending;
  updatePendingBadge();
}

function getPendingClocks() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEYS.pendingClocks)) || [];
  } catch { return []; }
}

async function syncPendingClocks() {
  if (!navigator.onLine) return;
  const pending = getPendingClocks();
  if (pending.length === 0) return;

  const toSync = [...pending];
  const failed = [];

  for (const clock of toSync) {
    try {
      const result = await api('POST', '/clock', {
        pin: clock.pin,
        type: clock.type || 'auto',
        tenant_id: clock.tenant_id,
        timestamp: clock.timestamp,
        latitude: clock.latitude,
        longitude: clock.longitude
      });
      if (result !== null) {
        // Synced successfully
        continue;
      }
      failed.push(clock);
    } catch {
      failed.push(clock);
    }
  }

  if (failed.length === 0) {
    localStorage.removeItem(STORAGE_KEYS.pendingClocks);
    state.pendingClocks = [];
    showToast('Fichajes pendientes sincronizados', 'check');
  } else {
    localStorage.setItem(STORAGE_KEYS.pendingClocks, JSON.stringify(failed));
    state.pendingClocks = failed;
  }
  updatePendingBadge();
  loadTodayHistory();
}

function updatePendingBadge() {
  const count = state.pendingClocks.length;
  if (count > 0) {
    pendingBadge.classList.remove('hidden');
    pendingCount.textContent = count;
  } else {
    pendingBadge.classList.add('hidden');
  }
}

// ===== TODAY HISTORY =====
async function loadTodayHistory() {
  if (!state.tenantId) return;

  try {
    const data = await api('GET', `/clock/today?tenant_id=${state.tenantId}&pin=${state.employeePin}`);
    if (data === null) {
      // Offline — show cached or empty
      return;
    }
    state.todayClocks = Array.isArray(data) ? data : (data.clocks || data.entries || []);
  } catch(e) {
    console.warn('Failed to load history:', e);
    state.todayClocks = [];
  }

  renderHistory();
}

function renderHistory() {
  const clocks = state.todayClocks;
  historyList.innerHTML = '';

  if (clocks.length === 0) {
    historyList.appendChild(historyEmpty);
    return;
  }

  clocks.forEach(c => {
    const time = c.time || c.created_at || c.timestamp || '';
    const timeStr = time ? new Date(time).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '--:--';
    const type = c.type || (c.is_entry !== false ? 'Entrada' : 'Salida');
    const typeLower = type.toLowerCase();
    const isEntry = typeLower === 'entrada' || typeLower === 'in' || c.is_entry !== false;
    const typeLabel = isEntry ? 'Entrada' : 'Salida';
    const typeClass = isEntry ? 'entrada' : 'salida';
    const hasLocation = c.latitude && c.longitude;

    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <div class="history-item-left">
        ${isEntry ? ICONS.entrada : ICONS.salida}
        <div>
          <div class="history-item-type ${typeClass}">${typeLabel}</div>
          <div class="history-item-time">${timeStr}</div>
          ${hasLocation ? `<div class="history-item-location">${ICONS.location} Con ubicacion</div>` : ''}
        </div>
      </div>
    `;
    historyList.appendChild(item);
  });
}

refreshHistoryBtn.addEventListener('click', loadTodayHistory);

// ===== TOAST =====
let toastTimeout = null;

function showToast(text, icon = 'check') {
  toastText.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

// ===== TENANT MODAL =====
changeTenantBtn.addEventListener('click', () => {
  populateTenantModalList(state.restaurants);
  tenantModal.classList.add('show');
});

tenantModalCancel.addEventListener('click', closeTenantModal);
tenantModal.addEventListener('click', (e) => {
  if (e.target === tenantModal) closeTenantModal();
});

function closeTenantModal() {
  tenantModal.classList.remove('show');
}

// ===== ONLINE/OFFLINE =====
window.addEventListener('online', () => {
  state.isOnline = true;
  offlineBanner.classList.remove('show');
  syncPendingClocks();
  loadTodayHistory();
});

window.addEventListener('offline', () => {
  state.isOnline = false;
  offlineBanner.classList.add('show');
});

// ===== SERVICE WORKER REGISTRATION =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/mobile/sw.js').then(reg => {
      console.log('SW registered:', reg.scope);
    }).catch(err => {
      console.warn('SW registration failed:', err);
    });
  });
}

// ===== INIT =====
(async function init() {
  // Load restaurants
  const restaurants = await loadRestaurants();
  populateTenantSelect(restaurants);
  populateTenantModalList(restaurants);

  // Check for saved session
  checkSession();

  // Show offline banner if offline
  if (!navigator.onLine) {
    offlineBanner.classList.add('show');
  }

  // Load pending count
  state.pendingClocks = getPendingClocks();
  updatePendingBadge();
})();
</script>
