; TalentUP Fichaje - PlatformIO config para CYD 2432S028
; ====================================================
; ESP32-WROOM-32 + TFT ILI9341 320x240 + Touch XPT2046
; PN532 NFC por I2C (RXD/GPIO3=SDA, TXD/GPIO1=SCL)
;
; Uso:
;   1. Modifica WIFI_SSID, WIFI_PASS, BACKEND_URL, TENANT_ID en build_flags
;   2. pio run -t upload  (o pio run -t upload --upload-port COM4)
;   3. pio device monitor  (o pio run -t monitor)

[env:cyd_2432S028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv

; Configuracion TFT_eSPI para CYD 2432S028
build_flags = 
    -DWIFI_SSID=\"JordiAlba\"
    -DWIFI_PASS=\"qwertyuio\"
    -DBACKEND_URL=\"http://192.168.0.16:8000\"
    -DTENANT_ID=\"default\"
    ; TFT_eSPI config
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -DSPR=0
    -DTFT_INVERSION_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; Touch XPT2046 config (bus SPI separado del TFT)
    -DTOUCH_CS=33
    -DTOUCH_IRQ=36
    -DSPI_TOUCH_FREQUENCY=2500000
    -DXPT2046_IRQ=36
    -DXPT2046_SPI_FREQ=2500000
    -DXPT2046_SPI_HOST=VSPI
    -DXPT2046_CS=33
    -DXPT2046_CLK=25
    -DXPT2046_MOSI=32
    -DXPT2046_MISO=39

; Librerias
lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.0
    bblanchon/ArduinoJson @ ^6.21.0
    bodmer/TFT_eSPI @ ^2.5.0

; Monitor
monitor_filters = 
    time